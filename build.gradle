plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Mixin-конфиг мода
    addModdingDependenciesTo(sourceSets.main)

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    // JDBC-драйверы, попадающие в classpath dev-окружения
    localRuntime
}

dependencies {
    // JDBC-драйверы. GoidaGriefLogger — standalone (GriefLogger удалён), поэтому драйверы он
    // больше НЕ наследует от GL.
    //
    // SQLite: бандлим в прод-jar через jarJar (NeoForge извлекает и кладёт в classpath на старте).
    //   Раньше sqlite-jdbc вёз GL; конфликт был только с тем экземпляром, GL удалён → бандлить
    //   теперь безопасно. compileOnly — для компиляции; localRuntime — для dev-запусков (dev не
    //   грузит из упакованного jar, поэтому jarJar в dev не извлекается).
    // MySQL: connector ставится в окружение сервера отдельно (как и раньше) — НЕ бандлим.
    compileOnly "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"
    localRuntime "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"
    jarJar("org.xerial:sqlite-jdbc") {
        version {
            strictly "[${sqlite_jdbc_version},4.0.0)"
            prefer "${sqlite_jdbc_version}"
        }
    }

    compileOnly "com.mysql:mysql-connector-j:${mysql_connector_version}"
    localRuntime "com.mysql:mysql-connector-j:${mysql_connector_version}"
}

// Сделать localRuntime доступным в dev-запусках, не утягивая в published-артефакт
configurations.runtimeClasspath.extendsFrom configurations.localRuntime

// Подстановка переменных в neoforge.mods.toml
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
