modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Yukovsky/GoidaGriefLogger/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

# Mixin-конфигурация — ядро + по одному конфигу на интеграцию (docs/06 §9).
# Мод-специфичные миксины внутри помечены require=0/remap=false → отсутствие мода даёт no-op, не краш.
[[mixins]]
config = "gle.mixins.json"

[[mixins]]
config = "gle.create.mixins.json"

[[mixins]]
config = "gle.toms.mixins.json"

# --- Зависимости ---

# NeoForge
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

# Minecraft
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# GriefLogger поглощён (Путь E): GoidaGriefLogger — единственный логгер и единственный писатель.
# Запускать вместе со старым grieflogger НЕЛЬЗЯ (оба заберут /gl и оба будут писать).
# Поэтому объявляем несовместимость, чтобы загрузчик не дал поднять оба мода разом.
[[dependencies.${mod_id}]]
modId = "grieflogger"
type = "incompatible"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

# Create — опциональная интеграция, грузимся после если присутствует
[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Tom's Simple Storage — опциональная интеграция
[[dependencies.${mod_id}]]
modId = "toms_storage"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Sophisticated Backpacks — опциональная интеграция
[[dependencies.${mod_id}]]
modId = "sophisticatedbackpacks"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
